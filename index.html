<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Google-Clone</title>

    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body> 
    <header>
        <nav>
            <a href="" class="nav-link">Gmail</a>
            <a href="" class="nav-link">Imágenes</a>
            <a href="" class="nav-apps"><img src="img/google-clone-recursos/img/apps-icon.png" alt="" width="25px"></a>
            <a href=""class="nav-loggin">Acceder</a>
        </nav>
    </header>
    <main>
        <section class="logo">
            <img src="img/google-clone-recursos/img/logo-google.png" alt="Logo de Google" width="300px">

        </section>
        <section class="buscador-bar">
            <form action="">
                <label class="label-buscador">
                    <img src="img/google-clone-recursos/img/search-icon.png" alt="Icono de Buscar" width="25px" class="icono-buscar">
                    <input type="text" name="buscador" id="buscar">
                    <a href="">
                        <img src="img/google-clone-recursos/img/camera-icon.png" alt="Icono de Microfono" width="25px">
                    </a>
                    <a href="">
                        <img src="img/google-clone-recursos/img/mic-icon.png" alt="Icono de camara" width="25px">
                    </a>
                </label>
            </form>

        </section>
        <section class="Botones">
            <button>Buscar con Google</button>
            <button>Voy a tener suerte</button>
            <p>
                Ofrecido por Google en:
                <a href="">Español (Latinoamerica)</a>
        </section>
    </main>
    <footer>
        <div class="Pais">México</div>
        <div class="footer-links">
            <Ul>
                <li><a href="">Sobre Google</a></li>
                <li><a href="">Publicidad</a></li>
                <li><a href="">Negocios</a></li>
                <li><a href="">Cómo funciona la Búsqueda</a></li>
            </Ul>   
            <ul>
                <li><a href="">Privacidad</a></li>
                <li><a href="">Condiciones</a></li>
                <li><a href="">Configuracion</a></li>
            </ul>

        </div>
    </footer>

</body>
</html>
